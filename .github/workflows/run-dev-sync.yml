name: run-dev-sync

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Push the generated README update to dev
        type: boolean
        default: false
      target_branch:
        description: Branch to update
        type: string
        default: dev
      base_ref:
        description: Base ref for change detection
        type: string
        default: origin/main
      target_ref:
        description: Target ref for change detection
        type: string
        default: origin/dev

permissions:
  contents: write

jobs:
  run-dev-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out dev workflow source
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Run reconciler from dev
        env:
          APPLY: ${{ inputs.apply }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          BASE_REF: ${{ inputs.base_ref }}
          TARGET_REF: ${{ inputs.target_ref }}
          DISPATCH_BRANCH: dev
          DELETE_DISPATCH_BRANCH: "false"
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import os
          import subprocess
          import yaml
          from pathlib import Path

          wf_path = Path('.github/workflows/sync-todo-readme.yml')
          doc = yaml.safe_load(wf_path.read_text(encoding='utf-8'))
          steps = doc['jobs']['sync']['steps']
          env = os.environ.copy()

          def run_step(step):
              name = step.get('name', 'unnamed')
              print(f"::group::{name}")
              result = subprocess.run(['bash', '-c', step['run']], env=env)
              print("::endgroup::")
              if result.returncode != 0:
                  raise SystemExit(result.returncode)

          for step in steps:
              name = step.get('name', '')
              if name == 'Extract and reconcile TODO entries':
                  run_step(step)
                  break

          summary = next((s for s in steps if s.get('name') == 'Show generated README summary'), None)
          if summary is not None:
              run_step(summary)

          if env.get('APPLY', 'false').lower() == 'true':
              commit = next((s for s in steps if s.get('name') == 'Commit generated README to requested branch'), None)
              if commit is None:
                  raise SystemExit('Commit step missing from dev workflow')
              run_step(commit)
          PY
