name: sync-todo-readme

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Write and push the README update to target branch
        type: boolean
        default: false
      target_branch:
        description: Remote branch whose README.md is updated
        type: string
        default: dev
      base_ref:
        description: Base ref for main-to-dev change detection
        type: string
        default: origin/main
      target_ref:
        description: Target ref for main-to-dev change detection
        type: string
        default: origin/dev
      delete_dispatch_branch:
        description: Delete the branch carrying this temporary workflow after success
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out dispatch branch with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Extract and reconcile TODO entries
        id: sync
        env:
          APPLY: ${{ inputs.apply }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          BASE_REF: ${{ inputs.base_ref }}
          TARGET_REF: ${{ inputs.target_ref }}
          DISPATCH_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import difflib
          import json
          import os
          import re
          import subprocess
          from collections import defaultdict
          from pathlib import Path

          ROOT = Path.cwd()
          README_PATH = ROOT / 'README.md'
          OUT_PATH = Path('/tmp/README.updated.md')
          TITLE = '### 📝 Complete TODO List'
          BASE_REF = os.environ.get('BASE_REF', 'origin/main')
          TARGET_REF = os.environ.get('TARGET_REF', 'origin/dev')
          TARGET_BRANCH = os.environ.get('TARGET_BRANCH', 'dev')
          APPLY = os.environ.get('APPLY', 'false').lower() == 'true'

          def run_git(*args):
              return subprocess.check_output(['git', *args], cwd=ROOT, text=True).strip()

          def norm(s):
              s = str(s or '').lower()
              s = re.sub(r'^\s*todo\s*(?:\([^)]*\))?\s*:?\s*', '', s)
              s = re.sub(r'[^a-z0-9]+', ' ', s)
              return re.sub(r'\s+', ' ', s).strip()

          def extract_todos(path, text):
              out = []
              pat = re.compile(r'^(?P<indent>\s*)#\s*TODO\s*(?P<rest>.*?)(?P<eol>\r?\n?)$', re.IGNORECASE)
              for lineno, line in enumerate(text.splitlines(), 1):
                  m = pat.match(line)
                  if not m:
                      continue
                  rest_raw = m.group('rest').strip()
                  am = re.match(r'^(?:\((?P<author>[^)]*)\))?\s*(?P<colon>:)?\s*(?P<body>.*)$', rest_raw)
                  author = am.group('author') if am else None
                  body = am.group('body') if am else rest_raw
                  # Preserve the conventional rendered text for TODO(author)...
                  comment_body = line.lstrip()[1:].strip()
                  dm = re.match(r'^TODO\s*(?P<tail>.*)$', comment_body, re.IGNORECASE | re.DOTALL)
                  tail = dm.group('tail') if dm else rest_raw
                  if re.match(r'^\s*:', tail):
                      default_msg = re.sub(r'^\s*:\s*', '', tail)
                  elif tail.lstrip().startswith('('):
                      default_msg = tail.lstrip()
                  else:
                      default_msg = re.sub(r'^\s*[:(]?\s*', '', tail)
                  out.append({
                      'path': path,
                      'line': lineno,
                      'raw_comment': line.strip(),
                      'author': author,
                      'body': body.strip(),
                      'rest_raw': rest_raw,
                      'default_message': default_msg.strip(),
                      'canon_default': norm(default_msg),
                      'canon_body': norm(body),
                      'canon_rest': norm(rest_raw),
                  })
              return out

          # All Python files in the checked-out tree are scanned for audit/completeness.
          skip_parts = {'.git', '__pycache__', '.venv', 'venv', 'node_modules', '.mypy_cache', '.pytest_cache'}
          all_py = []
          all_todos = {}
          for p in sorted(ROOT.rglob('*.py'), key=lambda x: x.relative_to(ROOT).as_posix()):
              rel_parts = p.relative_to(ROOT).parts
              if any(part in skip_parts for part in rel_parts):
                  continue
              rel = p.relative_to(ROOT).as_posix()
              all_py.append(rel)
              try:
                  txt = p.read_text(encoding='utf-8', errors='replace')
              except Exception as e:
                  print(f'WARNING cannot read {rel}: {e}')
                  continue
              todos = extract_todos(rel, txt)
              if todos:
                  all_todos[rel] = todos

          changed = run_git('diff', '--name-only', BASE_REF, TARGET_REF).splitlines()
          changed_py = [p for p in changed if p.endswith('.py')]
          print('=== TODO README sync diagnostic ===')
          print('apply:', APPLY, 'target branch:', TARGET_BRANCH)
          print('base/target:', BASE_REF, TARGET_REF)
          print('python files scanned:', len(all_py), 'files with TODO:', len(all_todos), 'TODO count:', sum(map(len, all_todos.values())))
          print('changed files:', json.dumps(changed, ensure_ascii=False))
          print('changed python files:', json.dumps(changed_py, ensure_ascii=False))
          for path in changed_py:
              print(f'--- current TODOs in {path}')
              for t in all_todos.get(path, []):
                  print(json.dumps({'line': t['line'], 'message': t['default_message'], 'raw': t['raw_comment']}, ensure_ascii=False))

          original = README_PATH.read_text(encoding='utf-8')
          title_matches = [i for i, line in enumerate(original.splitlines()) if line.strip() == TITLE]
          if len(title_matches) != 1:
              raise SystemExit(f'Expected exactly one unchanged title, found {len(title_matches)}')
          title_idx = title_matches[0]
          lines = original.splitlines(keepends=True)
          heading_re = re.compile(r'^##(?!#)\s+')
          end_idx = next((i for i in range(title_idx + 1, len(lines)) if heading_re.match(lines[i])), len(lines))
          entry_re = re.compile(r'^- \[ \] \*\*(?P<path>.+?):(?P<line>\d+)\*\* - (?P<msg>.*?)\r?\n?$')
          old_entries = []
          for i in range(title_idx + 1, end_idx):
              m = entry_re.match(lines[i])
              if m:
                  old_entries.append({
                      'index': i,
                      'path': m.group('path'),
                      'line': int(m.group('line')),
                      'message': m.group('msg'),
                      'text': lines[i].rstrip('\r\n'),
                      'canon': norm(m.group('msg')),
                  })
          if not old_entries:
              raise SystemExit('No existing TODO entries parsed from baseline README')
          first_idx = old_entries[0]['index']
          last_idx = old_entries[-1]['index']
          old_by_path = defaultdict(list)
          for e in old_entries:
              old_by_path[e['path']].append(e)
          print('baseline README entries:', len(old_entries))

          def choose_old(path, todo, used):
              candidates = old_by_path.get(path, [])
              available = [e for e in candidates if e['index'] not in used]
              if not available:
                  available = candidates
              # Exact normalized message/body matches first.
              for e in available:
                  if e['canon'] and e['canon'] in {todo['canon_default'], todo['canon_body'], todo['canon_rest']}:
                      return e, 'exact'
              # Handle extraction punctuation/author differences with similarity.
              best = None
              best_score = 0.0
              candidates_norm = [todo['canon_default'], todo['canon_body'], todo['canon_rest']]
              for e in available:
                  for cn in candidates_norm:
                      if not cn or not e['canon']:
                          continue
                      score = difflib.SequenceMatcher(None, e['canon'], cn).ratio()
                      if score > best_score:
                          best, best_score = e, score
              if best is not None and best_score >= 0.62:
                  return best, f'fuzzy:{best_score:.3f}'
              # Preserve source order when text matching is ambiguous after done items are removed.
              source_order = sorted(
                  [t for p in all_todos.items() if p == path for t in [None]] or [], key=lambda x: x['line']
              )
              return None, 'new-default-format'

          replacement_by_path = {}
          matches_log = []
          for path in changed_py:
              used = set()
              rendered = []
              todos = all_todos.get(path, [])
              for todo in sorted(todos, key=lambda x: (x['line'], x['raw_comment'])):
                  old, why = choose_old(path, todo, used)
                  if old is not None:
                      used.add(old['index'])
                      message = old['message']
                      matches_log.append({'path': path, 'line': todo['line'], 'old_line': old['line'], 'match': why, 'message': message})
                  else:
                      message = todo['default_message']
                      matches_log.append({'path': path, 'line': todo['line'], 'old_line': None, 'match': why, 'message': message})
                  rendered.append({
                      'path': path,
                      'line': todo['line'],
                      'message': message,
                      'text': f"- [ ] **{path}:{todo['line']}** - {message}",
                      'sort_key': (path, todo['line'], todo['raw_comment']),
                  })
              replacement_by_path[path] = rendered

          print('=== retained/new entry mapping')
          for row in matches_log:
              print(json.dumps(row, ensure_ascii=False))

          merged = []
          changed_set = set(changed_py)
          for e in old_entries:
              if e['path'] in changed_set:
                  continue
              merged.append({
                  'path': e['path'], 'line': e['line'], 'text': e['text'],
                  'sort_key': (e['path'], e['line'], e['text'])
              })
          for path in changed_py:
              merged.extend(replacement_by_path.get(path, []))
          merged.sort(key=lambda x: (x['path'], x['line'], x['text']))

          # Validate ordering and that every current changed-file TODO is represented.
          keys = [(x['path'], x['line']) for x in merged]
          if keys != sorted(keys):
              raise SystemExit('Merged TODO entries are not sorted by path and line')
          current_changed_keys = {(p, t['line']) for p in changed_py for t in all_todos.get(p, [])}
          rendered_changed_keys = {(x['path'], x['line']) for p in changed_py for x in replacement_by_path.get(p, [])}
          if current_changed_keys != rendered_changed_keys:
              raise SystemExit(f'Changed-file key mismatch {current_changed_keys ^ rendered_changed_keys}')
          if TITLE not in original:
              raise SystemExit('Title missing')

          new_block = [x['text'] + '\n' for x in merged]
          new_lines = lines[:first_idx] + new_block + lines[last_idx + 1:]
          new_text = ''.join(new_lines)
          if new_text.splitlines().count(TITLE) != 1:
              raise SystemExit('Section title count changed')
          OUT_PATH.write_text(new_text, encoding='utf-8')
          if APPLY:
              README_PATH.write_text(new_text, encoding='utf-8')

          old_count = len(old_entries)
          new_count = len(merged)
          diff = ''.join(difflib.unified_diff(
              original.splitlines(keepends=True),
              new_text.splitlines(keepends=True),
              fromfile='a/README.md', tofile='b/README.md', n=3
          ))
          print('entry counts:', old_count, '->', new_count, 'delta:', new_count - old_count)
          print('=== README.md diff (first 30000 chars) ===')
          print(diff[:30000])
          print('=== end diagnostic ===')
          PY

      - name: Show generated README summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f /tmp/README.updated.md ]; then
            echo "Generated README lines: $(wc -l < /tmp/README.updated.md)"
            grep -n -F '### 📝 Complete TODO List' /tmp/README.updated.md | head -1
            grep -c '^- \[ \] \*\*' /tmp/README.updated.md || true
          else
            echo 'No generated README file; Python step failed before output.'
          fi

      - name: Commit generated README to requested branch
        if: ${{ inputs.apply }}
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          DELETE_DISPATCH_BRANCH: ${{ inputs.delete_dispatch_branch }}
          DISPATCH_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp /tmp/README.updated.md /tmp/README.final.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          cp /tmp/README.final.md README.md
          if git diff --quiet -- README.md; then
            echo 'README.md already up to date; no commit created.'
          else
            git add README.md
            git commit -m 'docs: update complete TODO list from dev'
            git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          fi
          if [ "${DELETE_DISPATCH_BRANCH}" = 'true' ] && [ "${DISPATCH_BRANCH}" != "${TARGET_BRANCH}" ]; then
            git push origin --delete "${DISPATCH_BRANCH}" || true
          fi
